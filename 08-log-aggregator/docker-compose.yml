services:
  app:
    build: .
    ports:
      - "8008:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://logs:logs@postgres:5432/logs
      OPENSEARCH_URL: http://opensearch:9200
      LOG_INDEX: app-logs
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 5s
      timeout: 3s
      retries: 10
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
